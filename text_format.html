
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform</title>

    <style>
        .text_transform_uppercase {
            text-transform: uppercase;
        }

        .text_transform_lowercase {
            text-transform: lowercase;
        }

        .text_transform_capitalize {
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <h1>Hello Welcome Aditi</h1>

    <h1 class="text_transform_uppercase">Hello Welcome Aditi</h1>

    <h1 class="text_transform_lowercase">Hello Welcome Aditi</h1>

    <h1 class="text_transform_capitalize">hello welcome aditi</h1>

</body>
</html>
