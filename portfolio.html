
<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>

    <style>
        body {
            background-color: lavender;
            font-family: Arial;
            text-align: center;
        }

        .student {
            background-color: white;
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            border: 3px solid purple;
            border-radius: 20px;
        }

        h1 {
            color: purple;
            text-transform: uppercase;
        }

        h3 {
            color: darkblue;
        }

        p {
            font-size: 18px;
            color: gray;
        }

        button {
            background-color: purple;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
        }

        button:hover {
            background-color: deeppink;
        }
    </style>
</head>

<body>

    <div class="student">

        <h1>Student Details</h1>

        <h3>Name: Aditi</h3>

        <p>Course: BE Computer Engineering</p>

        <p>College: SVIT Nashik</p>

        <p>Skills: HTML, CSS, Java</p>

        <p>Year: 2026</p>

        <button>View Profile</button>

    </div>

</body>
</html>
