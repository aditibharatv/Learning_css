
<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .login {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;

            border: 3px solid purple;
            border-radius: 20px;
            box-shadow: 0px 10px 25px black;
        }

        h1 {
            color: purple;
            font-size: 35px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 2px 2px 5px pink;
        }

        p {
            color: gray;
            font-size: 16px;
            word-spacing: 4px;
            line-height: 1.5;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 12px;
            border: 2px solid lightgray;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.4s;
        }

        input:focus {
            border-color: purple;
            box-shadow: 0px 0px 8px pink;
        }

        button {
            width: 90%;
            padding: 12px;
            background: linear-gradient(to right, purple, deeppink);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background: darkblue;
            transform: scale(1.05);
            letter-spacing: 3px;
        }

    </style>
</head>

<body>

    <div class="login">

        <h1>Login</h1>

        <p>Welcome Back! Please Login</p>

        <form>
            <input type="text" placeholder="Enter Username">

            <input type="password" placeholder="Enter Password">

            <button type="submit">Login</button>
        </form>

    </div>

</body>
</html>
