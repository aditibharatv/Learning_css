
<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>

    <style>
        body {
            background: linear-gradient(to right, pink, lightblue);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .profile {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;

            border: 3px solid purple;
            border-radius: 25px;
            outline: 3px dashed orange;
            outline-offset: 5px;

            box-shadow: 5px 8px 20px gray;
        }

        h1 {
            color: purple;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px pink;
        }

        h3 {
            color: crimson;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-underline-offset: 5px;
        }

        p {
            color: #444;
            font-size: 17px;
            line-height: 1.8;
            word-spacing: 4px;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            background: purple;
            color: white;
            border: 2px solid purple;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.5s ease;
        }

        button:hover {
            background: white;
            color: purple;
            transform: translateY(-5px);
            box-shadow: 0 5px 12px pink;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>My Profile</h1>

        <h3>Web Developer</h3>

        <p>
            Hello! I am learning HTML, CSS and JavaScript.
            I love designing beautiful and creative websites.
            My goal is to become a professional developer.
        </p>

        <button>Contact Me</button>

    </div>

</body>
</html>
