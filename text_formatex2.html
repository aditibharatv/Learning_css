
<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting and Border</title>

    <style>
        h1 {
            color: brown;
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
            letter-spacing: 3px;
        }

        p {
            color: blue;
            font-size: 25px;
            font-family: Arial;
            font-weight: bold;
            text-align: justify;
            line-height: 1.5;
        }

        .box1 {
            border: 3px solid red;
            padding: 20px;
            margin: 20px;
        }

        .box2 {
            border: 5px dashed green;
            padding: 20px;
            margin: 20px;
        }

        .box3 {
            border: 4px dotted blue;
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>Text Formatting</h1>

    <p>
        Welcome to HTML and CSS.
        CSS is used to style web pages.
    </p>

    <div class="box1">
        Solid Border
    </div>

    <div class="box2">
        Dashed Border
    </div>

    <div class="box3">
        Dotted Border
    </div>

</body>
</html>
