
<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Properties</title>

    <style>
        body {
            background-color: lightcyan;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: darkblue;
            font-size: 40px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 3px 3px 5px gray;
            text-decoration: underline;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;

            /* Border properties */
            border: 4px solid navy;
            border-radius: 20px;
            border-top: 6px dashed red;
            border-bottom: 6px double green;

            /* Shadow property */
            box-shadow: 5px 5px 15px gray;
        }

        h2 {
            color: crimson;
            text-transform: capitalize;
            letter-spacing: 3px;
            word-spacing: 8px;
            text-decoration: overline;
        }

        p {
            color: black;
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
            text-indent: 30px;
        }

        button {
            background-color: navy;
            color: white;
            padding: 12px 25px;
            border: 2px solid orange;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background-color: orange;
            color: black;
            border-color: navy;
            transform: scale(1.1);
        }

        .box:hover {
            border-color: purple;
            box-shadow: 8px 8px 20px gray;
        }

    </style>
</head>

<body>

    <h1>Welcome To CSS</h1>

    <div class="box">

        <h2>Advanced CSS Learning</h2>

        <p>
            CSS stands for Cascading Style Sheets.
            It is used to design beautiful websites.
            We can apply different text styles,
            borders, shadows and animations.
        </p>

        <button>Explore More</button>

    </div>

</body>
</html>
