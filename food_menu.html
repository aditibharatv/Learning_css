
<!DOCTYPE html>
<html>
<head>
    <title>Food Menu</title>

    <style>
        body {
            background-color: #fff0e6;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: brown;
            font-size: 40px;
            text-transform: uppercase;
        }

        .menu {
            background-color: white;
            width: 300px;
            padding: 20px;
            margin: 20px auto;
            border: 2px solid brown;
            border-radius: 15px;
            box-shadow: 5px 5px 10px gray;
        }

        h2 {
            color: darkred;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: brown;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background-color: orange;
        }
    </style>
</head>

<body>

    <h1>Our Food Menu</h1>

    <div class="menu">
        <h2>Paneer Masala</h2>
        <p>Delicious Indian Special Food</p>
        <p class="price">Price: ₹180</p>
        <button>Order Now</button>
    </div>

    <div class="menu">
        <h2>Veg Biryani</h2>
        <p>Fresh and Spicy Biryani</p>
        <p class="price">Price: ₹150</p>
        <button>Order Now</button>
    </div>

    <div class="menu">
        <h2>Pizza</h2>
        <p>Cheesy and Tasty Pizza</p>
        <p class="price">Price: ₹200</p>
        <button>Order Now</button>
    </div>

</body>
</html>
