
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e8eaf6;
            text-align: center;
        }

        header {
            background: linear-gradient(to right, navy, purple);
            color: white;
            padding: 25px;
            border-bottom: 5px solid orange;
        }

        h1 {
            font-size: 40px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 3px 3px 5px black;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border: 3px solid purple;
            border-radius: 20px;
            box-shadow: 5px 5px 20px gray;
        }

        h2 {
            color: purple;
            text-decoration: underline;
            text-underline-offset: 8px;
            word-spacing: 5px;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skill {
            background-color: #ede7f6;
            color: purple;
            padding: 15px 25px;
            border: 2px dashed purple;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.4s;
        }

        .skill:hover {
            background-color: purple;
            color: white;
            transform: translateY(-5px);
            box-shadow: 3px 5px 10px gray;
        }

        button {
            background-color: purple;
            color: white;
            padding: 14px 30px;
            border: 2px solid orange;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background-color: orange;
            color: black;
            transform: scale(1.1);
        }

        footer {
            background-color: navy;
            color: white;
            padding: 20px;
            margin-top: 30px;
            letter-spacing: 2px;
        }

    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
        <p style="color:white;">Welcome to My Website</p>
    </header>

    <div class="container">

        <h2>About Me</h2>

        <p>
            Hello! I am a Computer Engineering Graduate.
            I am interested in Web Development.
            I love learning new technologies and creating
            beautiful websites.
        </p>

        <h2>My Skills</h2>

        <div class="skills">
            <div class="skill">HTML</div>
            <div class="skill">CSS</div>
            <div class="skill">Java</div>
            <div class="skill">SQL</div>
            <div class="skill">JavaScript</div>
        </div>

        <br><br>

        <button>Contact Me</button>

    </div>

    <footer>
        <p style="color:white;">
            © 2026 My Portfolio | All Rights Reserved
        </p>
    </footer>

</body>
</html>
