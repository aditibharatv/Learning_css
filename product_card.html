
<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .product {
            width: 320px;
            margin: 80px auto;
            padding: 25px;
            background-color: white;

            border: 3px solid purple;
            border-radius: 20px;
            box-shadow: 0px 5px 20px gray;

            transition: 0.5s;
        }

        .product:hover {
            transform: translateY(-10px);
            box-shadow: 0px 12px 25px gray;
            border-color: deeppink;
        }

        h1 {
            color: purple;
            font-size: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px pink;
        }

        h2 {
            color: darkblue;
            text-transform: capitalize;
            text-decoration: underline;
            text-underline-offset: 5px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.7;
            word-spacing: 3px;
        }

        .price {
            color: red;
            font-size: 25px;
            font-weight: bold;
            text-decoration: underline;
        }

        button {
            background: linear-gradient(to right, purple, deeppink);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background: darkblue;
            transform: scale(1.1);
            letter-spacing: 2px;
        }

    </style>
</head>

<body>

    <div class="product">

        <h1>Special Offer</h1>

        <h2>Stylish Kurti</h2>

        <p>
            Beautiful and comfortable kurti.
            Available in different sizes and colors.
            Perfect for daily wear.
        </p>

        <div class="price">₹599</div>

        <br>

        <button>Buy Now</button>

    </div>

</body>
</html>
