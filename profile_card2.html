
<!DOCTYPE html>
<html>
<head>
    <title>My Profile Card</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .card {
            background-color: white;
            width: 300px;
            padding: 20px;
            margin: 100px auto;
            border: 3px solid navy;
            border-radius: 15px;
        }

        h1 {
            color: darkblue;
            text-transform: uppercase;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: orange;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>My Profile</h1>
        <p>Hello! I am a Web Developer.</p>
        <p>I love learning HTML and CSS.</p>
        <button>Read More</button>
    </div>

</body>
</html>
