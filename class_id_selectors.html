<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heading1{
            color:red;

        }
        .heading2{
            color:blue;

        }
        #heading_2{
            color:pink;
        }
        .heading_2{
            color:blue;
        }
        h1{
            color:blueviolet;
        }
        .hello{
            color:red;
        }
        .hello_font{
            font-size:120px;
        }
        .welcome{
            color:blue;
        }
        .welcome_font{
            font_size:120px;
        }
    </style>
</head>
<body>
    <!-- class selector -->
    <h1 class="heading1">This is Heading Class Example1</h1>
    <h1 class="heading2">This is Heading Class Example2</h1>
    
    <!-- ID selector -->
     <h2 id="heading_2">This is ID Example</h2>
    <h2 id="heading_2" class="heading_2">This is ID Example2</h2>

    <h6 class="hello" hello_font>Hello welcome to India</h6>
    <h6 class="welcome" welcome_font>Hello welcome to India</h6>

</body>
</html>
