
<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>

    <style>
        body {
            background-color: beige;
            font-family: Arial;
        }

        h1 {
            color: darkred;
            text-align: center;
            text-transform: uppercase;
        }

        .menu {
            background-color: white;
            border: 2px solid brown;
            width: 350px;
            padding: 20px;
            margin: 30px auto;
            border-radius: 10px;
        }

        h2 {
            color: chocolate;
            text-decoration: underline;
        }

        p {
            font-size: 18px;
            color: darkgreen;
        }

        .price {
            color: red;
            font-weight: bold;
        }

        button {
            background-color: darkred;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <h1>My Restaurant</h1>

    <div class="menu">
        <h2>Food Menu</h2>

        <p>Pizza <span class="price">₹200</span></p>
        <p>Burger <span class="price">₹100</span></p>
        <p>Pasta <span class="price">₹150</span></p>
        <p>Sandwich <span class="price">₹80</span></p>

        <button>Order Now</button>
    </div>

</body>
</html>
