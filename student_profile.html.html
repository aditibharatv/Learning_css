
<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            background-color: lightyellow;
        }

        h1 {
            color: darkblue;
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
        }

        .profile {
            background-color: white;
            border: 4px solid purple;
            border-radius: 15px;
            padding: 20px;
            margin: 30px;
            text-align: center;
        }

        h2 {
            color: brown;
            letter-spacing: 2px;
        }

        p {
            color: darkgreen;
            font-size: 20px;
            font-family: Arial;
            font-weight: bold;
        }

        .course {
            border: 2px dashed red;
            padding: 10px;
        }

    </style>
</head>

<body>

    <h1>My Student Profile</h1>

    <div class="profile">

        <h2>Aditi Vishwas</h2>

        <p>BE Computer Engineering</p>

        <p>College: SVIT Nashik</p>

        <p class="course">Course: Full Stack Development</p>

    </div>

</body>
</html>
