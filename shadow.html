<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow </title>
    <style>
        .b_shadow{
             box-shadow: 7px 8px 6px red ;
        }
        .b_shadow2{
             box-shadow: 7px 8px 6px blue ;
        }
        .b_shadow3{
             box-shadow: 7px 8px 6px pink ;
        }
        .b_shadow{
            width: 500px;
             box-shadow: 7px 8px 6px yellow ;
        }
        .d_shadow{
            width: 500px;
            filter: drop-shadow(8px 9px 10px blue);
        }
    </style>
</head>
<body>
    <!-- box  shadow -->
    <img class=b_shadow src="Images/Sunset.jpg" alt=" ">
    <img class=b_shadow2 src="Images/Nature.jpg" alt=" ">
    <img class=b_shadow3 src="Images/flower.jpg" alt=" ">
    <!-- drop shadow -->
     <img class=d_shadow src="Images/Tree.png.png" alt=" ">
     <img class=b_shadow src="Images/Tree.png.png" alt=" ">
     

    
</body>
</html>
